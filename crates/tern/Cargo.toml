[package]
name = "tern"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A personal AI agent in one static binary"

[lints]
workspace = true

[features]
# `tern tray`, the menu-bar icon, and SMAppService login items
# (personal-agent-tooling-spec §11.3). Its dependencies are macOS-only, so
# Linux and musl server builds are unchanged with it on.
default = ["tray", "python"]
tray = [
    "dep:tray-icon",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:dispatch2",
    "dep:smappservice-rs",
]
# The `python` tool on Monty (docs/python-tool-spec.md).
python = ["dep:tern-python", "dep:monty-alloc"]

[dependencies]
tern-auth.workspace = true
tern-core.workspace = true
tern-gateway.workspace = true
tern-lua.workspace = true
tern-mcp.workspace = true
tern-store.workspace = true
tern-providers.workspace = true
tern-python = { workspace = true, optional = true }
monty-alloc = { workspace = true, optional = true }
tern-sandbox.workspace = true
tern-tools.workspace = true
tern-tui.workspace = true

anyhow.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
futures.workspace = true
hyper.workspace = true
hyper-util.workspace = true
qrcode.workspace = true
rcgen.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
smappservice-rs = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[dev-dependencies]
rusqlite.workspace = true
tern-store.workspace = true
serde_json.workspace = true
tempfile.workspace = true
wiremock.workspace = true

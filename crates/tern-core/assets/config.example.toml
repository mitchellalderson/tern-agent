# tern configuration. See `tern doctor` for what is missing.

# Model used when none is given, as "provider:model". A list is a fallback
# chain: when a call to the first fails with an overload, a server error, a
# rate limit, a network error or an auth/billing error (after its retries),
# the same call goes to the next. Bad requests never fall back. Any run on
# the first model gets the chain, whatever picked it.
# default_model = "anthropic:claude-sonnet-4-5"
# default_model = ["anthropic:claude-sonnet-4-5", "openrouter:anthropic/claude-sonnet-4.5"]

workspace = "~/tern-workspace"   # where the agent works; shell commands start here
max_iterations = 40              # model calls per run before it stops
# Model context window in tokens; old messages are summarized past 75%.
# Override per provider with `context_window` in its [providers.*] table.
context_window = 128000

# Secrets (API keys, tokens) are read from environment variables first,
# then from secrets.toml next to this file (which must be mode 0600).
# The agent can ask you for one with a private prompt; it waits this long.
secret_request_timeout_secs = 900

# How much runs may do without asking: "readonly", "supervised" (the
# default), "autonomous" (untainted writes don't ask) or "yolo" (nothing
# asks; doctor shows it in red). Routines can set their own.
# autonomy = "supervised"

# [providers.anthropic]
# kind = "anthropic"
# api_key_secret = "ANTHROPIC_API_KEY"

# [providers.openrouter]
# kind = "openai_compat"
# base_url = "https://openrouter.ai/api/v1"
# api_key_secret = "OPENROUTER_API_KEY"

# [providers.ollama]
# kind = "openai_compat"
# base_url = "http://localhost:11434/v1"

[sandbox]
# Where shell commands run: "host" (this computer, in an OS sandbox) or
# "docker" (a container per command).
backend = "host"           # "host" | "docker"
shell_timeout_secs = 120   # a command running longer is stopped
# Off: a command gets the network only by asking (`network: true`), and you
# approve each one; its output is untrusted. true: every command, always.
network = false            # IP networking for every shell command
# Host backend: shell commands run in an OS sandbox (Seatbelt on macOS,
# Landlock on Linux): write only to the workspace and temp dirs, no reads of
# your home directory beyond these paths. See docs/sandbox-design.md.
confine = "auto"           # "auto" | "required" | "off"
read_paths = ["~/.gitconfig", "~/.config/git"]   # also readable, outside the workspace
write_paths = []           # also writable, e.g. ["~/.cache", "~/.npm"]
docker_image = "debian:stable-slim"   # docker backend: the image commands run in
docker_memory = "2g"       # "" for no limit
docker_cpus = 2.0          # 0 for no limit
docker_pids = 512          # 0 for no limit

# [gateway.telegram]
# enabled = true
# bot_token_secret = "TELEGRAM_BOT_TOKEN"

# Gateway connectors: Luau connectors with a `gateway` table that tern runs as
# chat transports, so routine results, approvals and outbox cards reach you
# there too. `tern gateway add ntfy` (or `slack`) installs one and adds this
# table; delivery targets are then `ntfy:<topic>` or `slack:<channel id>`.
# [gateway.connectors.ntfy]
# enabled = true
# poll_secs = 30             # how often to check for replies
# strangers = "reply"        # unpaired senders: "reply" (a fixed note), "ignore",
#                            # or "taint" (a run that asks before any write)
# settings = { topic = "tern-x7…", reply_topic = "tern-x7…-in" }   # handed to the connector

# [mcp.servers.github]
# transport = "stdio"
# command = "github-mcp-server"
# args = ["stdio"]
# env_secrets = ["GITHUB_TOKEN"]
# env = { LOG_LEVEL = "warn" }      # plain values only; keys go in env_secrets
# disabled_tools = ["delete_repo"]  # hide some of its tools
# enabled = false                   # keep it configured but off
#
# [mcp.servers.linear]
# transport = "http"
# url = "https://mcp.linear.app/mcp"
# bearer_token_secret = "LINEAR_TOKEN"

# tern as an MCP server (`tern mcp serve`): Claude Desktop, Cursor or Claude
# Code launch it and use your connectors, memory, channels and routines
# through tern. `tern mcp serve --print-config` prints the client snippet.
# Every call is a run in tern (trigger `mcp`) that starts tainted: writes ask
# in tern, never in the client, and wait in the outbox when nobody answers.
# Files, commands, URLs, secrets and sign-ins are never offered.
# [mcp.serve]
# agent = "scribe"             # whose tool scope applies (unset: memory_search, channel_read, schedule_list, skill_read)
# autonomy = "readonly"        # caps `autonomy` for MCP calls; it can't raise it

# Sub-agents: the agent_spawn / agent_wait / agent_cancel / agent_status / agent_result tools.
# [subagents]
# enabled = true             # false: no agent_* tools, and the prompt doesn't mention them
# default_model = "anthropic:claude-sonnet-4-5"   # unset = the parent's model; may be a chain
# models = { fast = "anthropic:claude-haiku-4-5" } # aliases for agent_spawn's `model`; each may be a chain
# max_depth = 1               # 1 = sub-agents can't start their own
# max_concurrent = 4          # running per parent; more are queued
# max_children = 12           # per parent run, in total
# max_concurrent_global = 8   # running across tern; more are queued
# max_iterations = 30         # per sub-agent, unless agent_spawn asks for more or fewer
# max_iterations_ceiling = 100  # the most agent_spawn may ask for
# budget_tokens = 400000      # per sub-agent: input + output + cache tokens, on every model call
# budget_tokens_ceiling = 2000000  # the most agent_spawn may ask for (0 = no ceiling)
# ask_parent_timeout_secs = 900  # how long agent_ask_parent waits for an answer
# max_result_chars = 8000     # most of a sub-agent's final report that reaches the parent (the rest: agent_result)

# Memory: user.md and memory.md are in every system prompt, each within a
# token cap (chars / 4). Writes past a cap are refused with a request to
# consolidate; a file edited by hand past its cap is cut, with a note.
# [memory]
# user_md_tokens = 1500        # cap for user.md, what tern knows about you
# memory_md_tokens = 1500      # cap for memory.md, the agent's own notes
# flush = true                 # before compacting, let the agent save durable facts (memory_save)
# Every agent, read-only ones too, can save and recall its own notes. These
# caps keep a loop or an injected page from flooding them:
# entry_max_chars = 2000       # one memory_save
# run_max_writes = 20          # saves and forgets one run may make
# max_entries = 500            # memories one agent (or the shared pool) may hold
# max_chars = 200000           # characters across them
# routine_carryover_chars = 4000  # a routine's last report the next run is given, as data (0 = off)

# Skill capture: after a long, clean run tern offers once to save it as a
# skill. Accepting writes a draft to skills/<name>/SKILL.md (draft: true) that
# stays out of the prompt until you publish it (`tern skills publish <name>`).
# [skills]
# capture = true               # false: never offer
# capture_min_tool_calls = 8   # tool calls a run needs before it is offered

# A write nobody approves in time waits in the outbox (`tern outbox`) instead
# of being denied.
# [outbox]
# wait_secs = 120              # at once when no app, TUI or tray is attached
# expire_hours = 72           # how long an item waits for you before it expires

# Taint: once a run has read untrusted content (a web page, an email), a
# network read to a site it hasn't reached yet asks first, so injected text
# can't send what the agent knows somewhere new.
# [taint]
# egress = "ask"               # "allow" for runs meant to browse; an agent can set its own
# workspace_writes = true      # edits in the agent's own folder skip the taint prompt; false: all writes ask

# Web pages are never read by the agent that asked for them. http_fetch hands the
# URL to a separate low-privilege reader (two tools, no approvals, no memory or
# files, hard limits) and returns a short checked result. With only a URL it
# reads the page without any model and returns data only (headings, tables,
# links; ask for want = ["text"] to get prose, which taints the run); with a
# question it uses a cheap model from your own providers. See docs/quarantined-fetch-design.md.
# [fetch]
# taint = "strict"             # "strict": only free text (answer, text) taints the caller; "legacy": every fetch does
# model = "anthropic:claude-haiku"  # reads pages when a question is asked; unset = the cheapest model you configured
# ask_when_tainted = false     # true: a run that already read untrusted text may still ask a free-text question
# max_bytes = 2097152          # most bytes read from one page
# max_pages = 3                # most pages one fetch may read
# max_redirects = 5            # most redirects followed per page
# timeout_secs = 30            # seconds per page request
# max_iterations = 3           # most model turns the reader takes per fetch
# budget_tokens = 30000        # most tokens the reader may use per fetch
# spend_cap_usd = 0.02         # most dollars the reader may spend per fetch (when the price is known)
# result_max_bytes = 8192      # largest result handed to the agent
# extract_text_bytes = 6144    # most page text an extract result carries
# cache_secs = 900             # reuse a result for the same page and question this long
# max_calls_per_run = 40       # most fetches one run may make
# max_concurrent = 4           # most fetches in flight at once
# allow_domains = []           # only these sites (and subdomains); empty = any public site
# deny_domains = []            # never these sites; wins over allow_domains

# Luau connectors (~/.tern/connectors). A connector can declare its own rate
# (capabilities.rate = "60/min"); this is the limit for those that don't.
# [connectors]
# rate = "120/min"             # HTTP requests per connector, shared by every run and script
# record_tests = true          # connector_test saves a live call as a fixture (no credentials) and replays it offline next time
# openapi_tools = 8            # operations connector_from_openapi generates when none are named (reads first)
# openapi_max_tools = 40       # most operations one connector generated from an OpenAPI document may have

# Signing in to services: OAuth first, keys as the fallback, and the user
# chooses. Connections are accounts: `tern connections`, /connections in the
# TUI, or the app's Connections view. Tokens live in secrets.toml under
# conn/<service>/<account>/ and never reach the model or a script.
# [auth]
# sign_in_timeout_secs = 300   # how long a sign-in waits for the browser or a device code
# max_connections = 10         # accounts per connector or MCP server
# idle_timeout_secs = 600      # an extra account's stdio MCP server stops after this long unused
# local_issuers = []           # OAuth servers allowed on private addresses, e.g. ["http://127.0.0.1:8080"]
# client_metadata_url = ""     # https URL of a client ID metadata document, for servers that take one instead of registration

# Bundles: connectors, skills and routines others share as a URL or a
# file (`tern bundle install`). Each is shown in full and installed only on
# approval; connectors arrive inactive and routines paused.
# [bundles]
# require_signed = false       # refuse unsigned bundles instead of warning
# allow_private_hosts = false  # fetch bundle URLs on your own network (http allowed there)

# The `python` tool: sandboxed compute whose scripts call your tools by name
# (docs/python-tool-spec.md). Each call is checked, approved and journaled like
# a direct one. Read when tern starts.
# [python]
# enabled = true               # offer the tool (when this build has it)
# max_seconds = 30             # interpreter time per script, tool calls excluded
# max_turn_seconds = 10        # interpreter time between two tool calls
# max_wall_seconds = 600       # wall time per script, tool calls included, approval waits excluded
# max_memory_mb = 256          # memory the interpreter may use
# max_host_calls = 200         # tool calls one script may make
# max_parallel = 4             # tool calls run at once when a script awaits several (asyncio.gather)
# max_asks = 3                 # approval prompts one script may cause; the next call that would ask is refused
# max_writes = 10              # write calls one script may make
# allow_writes = false         # scripts may call write tools (destructive ones never); each asks like a direct call

# OAuth apps you registered yourself, by provider. Google wants a "Desktop
# app" client, whose client secret goes in secrets.toml under the name given.
# [auth.clients]
# google = { client_id = "1234-abc.apps.googleusercontent.com", client_secret_secret = "GOOGLE_CLIENT_SECRET" }
# An app for a provider without a built-in profile names the issuer it
# belongs to; tern only sends it (and its secret) to endpoints on that origin.
# acme_com = { client_id = "…", issuer = "https://login.acme.com" }

# Scheduled prompts (schedule_create, the app's routines). Each schedule can
# override these.
# [schedules]
# quiet_hours = "22:00-07:30"   # local; results finishing inside wait until the end. "none" = off
# runs_per_day = 24             # then the schedule pauses until tomorrow (unset = no cap)
# usd_per_day = 1.0             # needs the model's price (see `prices` below)
# tokens_per_run = 200000       # a run that uses more is stopped and fails
# max_events_per_poll = 20      # new watch events that each start a run; the rest share one run
# initiative = "digest"         # how results reach the chat: silent | digest | notify | interrupt (a routine can set its own)
# initiative_dial = "normal"    # every routine one level "quieter" or "louder", or "vacation" (nothing pushed)
# digest_times = ["08:30", "17:30"]  # local times digest results are sent, as one message
# gate_model = "openrouter:cheap-model"  # decides if a "notify" result is worth a push (default: the cheapest priced model)
#
# Home (and each Telegram chat) is one stream cut into sessions. A message
# starts a new one, with a summary of the last carried over, after:
# [home]
# idle_hours = 6                # this long without a message
# day_starts = "04:00"          # a new day (local), once idle for an hour

# Where the API listens, for the desktop app on other devices and the
# phone (docs/deployment-spec.md). The Unix socket is always on.
# [api]
# listen = ["unix", "tcp://0.0.0.0:8711"]  # add tcp:// listeners for paired devices
# tls = "auto"  # "auto": a self-signed certificate devices pin; "files": tls_cert and tls_key; "off": plain HTTP
# tls_cert = "/etc/tern/cert.pem"  # certificate chain (PEM), for tls = "files"
# tls_key = "/etc/tern/key.pem"    # its private key (PEM), for tls = "files"
# trust_proxy = false           # trust X-Forwarded-For from a reverse proxy on loopback
# public_url = "https://tern.example.com"  # put in pairing links; default: the first tcp listener
# remote_mcp_stdio = false      # let paired devices add stdio MCP servers (they run on this host)

# Webhook routines (`tern hooks create`) are reached on a listener of their
# own, never the API's: it takes only each routine's own secret, never a
# device token. Off by default; `tern hooks fire` works without it.
# [webhooks]
# listen = ["tcp://127.0.0.1:8712"]  # e.g. behind a tunnel or reverse proxy
# tls = "off"                   # unset: the same as [api] tls (and its certificate files)
# public_url = "https://hooks.example.com"  # the base of each hook's URL; default: the first listener
# max_body_kb = 256             # larger bodies get 413
# per_minute = 30               # deliveries one routine accepts per minute; more get 429
# tolerance_secs = 300          # how old a signed X-Tern-Signature timestamp may be
# header_timeout_secs = 10      # time to send the TLS handshake and headers (or idle between requests); slower connections are closed
# body_timeout_secs = 30        # time to send a body once its headers are in; slower gets 408
# max_connections = 64          # open connections at once; more are refused (503, or closed under TLS)
#
# Prices (USD per million tokens) for models whose list doesn't give them:
# [providers.anthropic.prices]
# "claude-sonnet-4-5" = { input = 3.0, output = 15.0, cache_read = 0.3, cache_write = 3.75 }

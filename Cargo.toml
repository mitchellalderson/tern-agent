[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
tern-auth = { path = "crates/tern-auth" }
tern-bundle = { path = "crates/tern-bundle" }
tern-core = { path = "crates/tern-core" }
tern-gateway = { path = "crates/tern-gateway" }
tern-lua = { path = "crates/tern-lua" }
tern-mcp = { path = "crates/tern-mcp" }
tern-store = { path = "crates/tern-store" }
tern-providers = { path = "crates/tern-providers" }
tern-python = { path = "crates/tern-python" }
tern-tools = { path = "crates/tern-tools" }
tern-tui = { path = "crates/tern-tui" }
tern-sandbox = { path = "crates/tern-sandbox" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "multipart"] }
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
blake3 = "1.8.7"
# The workspace scope: handle-based (openat) file access, no check-then-open.
cap-std = "4.0.3"
# Direct for the webhook listener's header timeout; axum already pulls both in.
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "service", "http1", "server"] }
# minisign's prehashed signatures (bundles, tooling spec §6.5).
blake2 = "0.10.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fastrand = "2.5.0"
futures = "0.3.34"
html2text = "0.17.4"
ignore = "0.4.34"
regex = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# The public suffix list, for "same registrable domain" checks on OAuth
# endpoints (tooling spec §6.7.2).
psl = "2.1.246"
# Monty (docs/python-tool-spec.md): pinned exactly; it releases weekly.
monty = "=1.4.0"
# The helper's memory ceiling; `exit-code` reports it as exit 65, not an abort.
monty-alloc = { version = "=1.4.0", features = ["exit-code"] }
monty-fs = "=1.4.0"
monty-types = "=1.4.0"
mlua = { version = "0.12.2", features = ["luau", "async", "serialize", "send"] }
ratatui = "0.30.2"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
# Bundles as `.tar.zst` (tooling spec §6.5): pure Rust, no C zstd.
ruzstd = "0.9.1"
tar = { version = "0.4.46", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The activity ledger's hash chain (tooling spec §8.1).
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal", "sync", "fs", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
landlock = "0.4.7"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
seccompiler = "0.5"
tracing-appender = "0.2.5"
# OpenAPI documents in YAML (T4c); pure Rust, no unsafe.
yaml-rust2 = { version = "0.13.0", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }
# StatusNotifierItem over D-Bus (zbus, pure Rust; no GTK), the Linux tray (T8c).
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSProcessInfo"] }
smappservice-rs = "0.1.3"
unicode-width = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }
webpki-root-certs = "1.0.11"
wiremock = "0.6.5"

# Everyday optimized builds: thin LTO and parallel codegen use every core.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
# Keep the default `panic = "unwind"`: Luau raises Lua errors as C++
# exceptions that unwind through mlua's Rust frames, and with "abort" any
# connector error (even `error("...")`) terminates the process.

# Shipped binaries (`--profile dist`): smallest output, but the final
# codegen runs on a single core, so it's slow to build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Monty (the `python` tool) is most of a megabyte per crate at -O3, and
# scripts are small: optimize its interpreter, parser and tables for size.
[profile.dist.package.monty]
opt-level = "s"
[profile.dist.package.monty-types]
opt-level = "s"
[profile.dist.package.monty-fs]
opt-level = "s"
[profile.dist.package.ruff_python_parser]
opt-level = "s"
[profile.dist.package.ruff_python_ast]
opt-level = "s"
[profile.dist.package.unicode_names2]
opt-level = "s"

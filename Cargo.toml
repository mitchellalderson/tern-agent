[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
tern-core = { path = "crates/tern-core" }
tern-gateway = { path = "crates/tern-gateway" }
tern-lua = { path = "crates/tern-lua" }
tern-mcp = { path = "crates/tern-mcp" }
tern-store = { path = "crates/tern-store" }
tern-providers = { path = "crates/tern-providers" }
tern-tools = { path = "crates/tern-tools" }
tern-tui = { path = "crates/tern-tui" }
tern-sandbox = { path = "crates/tern-sandbox" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query", "multipart"] }
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fastrand = "2.5.0"
futures = "0.3.34"
html2text = "0.17.4"
ignore = "0.4.34"
regex = "1.13.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
mlua = { version = "0.12.2", features = ["luau", "async", "serialize", "send"] }
ratatui = "0.30.2"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "signal", "sync", "fs", "net"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
landlock = "0.4.7"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["signal"] }
seccompiler = "0.5"
tracing-appender = "0.2.5"
unicode-width = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }
webpki-root-certs = "1.0.11"
wiremock = "0.6.5"

# Everyday optimized builds: thin LTO and parallel codegen use every core.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
# Keep the default `panic = "unwind"`: Luau raises Lua errors as C++
# exceptions that unwind through mlua's Rust frames, and with "abort" any
# connector error (even `error("...")`) terminates the process.

# Shipped binaries (`--profile dist`): smallest output, but the final
# codegen runs on a single core, so it's slow to build.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

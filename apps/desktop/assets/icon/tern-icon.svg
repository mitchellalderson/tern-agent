<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>tern</title>
  <!--
    tern app icon: an abstract tern, seen from below, in a circle field.

    Editing:
      - Colors: change the fill on #field, #bird and #cap (accent matches
        lib/theme.dart light accent 0xFFF07A2B).
      - Size / heading / position: edit the transform on #bird-group.
        translate = center of the bird, rotate = heading (0 = straight up),
        scale = size. Bird geometry is drawn around (0,0), pointing up.
      - The bird is one symmetric path: the left half mirrors the right half.
        Change a right-side point, then change its mirror (negate x).
      - Drop #cap for a plain one-colour silhouette (good for small sizes
        and monochrome menu-bar templates).
  -->
  <circle id="field" cx="256" cy="256" r="256" fill="#F07A2B"/>

  <g id="bird-group" transform="translate(258 244) rotate(35) scale(0.98)">
    <path id="bird" fill="#FCF7EB" d="
      M 0 -140
      L 7 -108
      C 14 -100 16 -80 15 -65
      C 50 -72 95 -70 125 -55
      C 160 -38 185 -10 200 20
      C 165 0 110 -12 60 -10
      C 35 -9 18 -2 15 10
      C 14 35 12 50 10 62
      L 46 155
      C 30 125 14 100 0 92
      C -14 100 -30 125 -46 155
      L -10 62
      C -12 50 -14 35 -15 10
      C -18 -2 -35 -9 -60 -10
      C -110 -12 -165 0 -200 20
      C -185 -10 -160 -38 -125 -55
      C -95 -70 -50 -72 -15 -65
      C -16 -80 -14 -100 -7 -108
      Z"/>
    <!-- Black cap: the tern's signature marking. -->
    <path id="cap" fill="#2B2118" d="
      M 6 -104
      C 11 -98 13 -90 13 -84
      C 6 -81 -6 -81 -13 -84
      C -13 -90 -11 -98 -6 -104
      Z"/>
  </g>
</svg>

name: tern_desktop
description: Desktop app for the tern agent.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  tern_client:
    path: packages/tern_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tern-mark.png
  fonts:
    # SIL OFL 1.1 fonts (Archivo, DM Sans, JetBrains Mono); see docs/brand/brand-guide.md.
    - family: TernDisplay
      fonts:
        - asset: assets/fonts/ArchivoDisplay-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/ArchivoDisplay-BlackItalic.ttf
          weight: 900
          style: italic
    - family: TernSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: TernMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

name: ci

# Cost policy (docs/ci-cost.md): Linux does the full, OS-independent suite on
# every run. macOS (about 10x the price per minute) runs only what is
# genuinely macOS-specific, and only after Linux is green, on: pushes to main,
# release checks, manual runs, and PRs labelled `ci-macos`. The universal DMG
# is built on manual runs and the nightly schedule (and by release.yml for
# tags), never on every push.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Run it by hand (Actions > ci > Run workflow) to get a desktop DMG from any branch.
  workflow_dispatch:
    inputs:
      macos:
        description: Run the macOS job (and the DMG). Untick for a Linux-only run.
        type: boolean
        default: true
  # Nightly DMG from main, skipped when main has no commits in the last day.
  schedule:
    - cron: "17 6 * * *"
  # release.yml runs the checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      skip_builds:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same ref supersedes the older run (bursts of agent
# pushes to main test only the tip). Tag runs (releases) are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debuginfo for every test binary filled the 14 GB Linux runner disk
  # ("No space left on device" during cargo test-all). Line tables keep
  # backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      # Every commit, not just the diff: the config is .gitleaks.toml and
      # reviewed false positives are in .gitleaksignore.
      - run: ./gitleaks git . --redact --no-banner --exit-code 1

  # Decides what the heavy jobs do. Docs/markdown/image-only changes skip them
  # (gitleaks above always runs). On pull requests, `rust` and `dart` narrow
  # the Linux jobs to what the changed paths need (scripts/ci-classify.sh).
  # Anything unclear counts as a code change in both areas.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      macos: ${{ steps.diff.outputs.macos }}
      rust: ${{ steps.diff.outputs.rust }}
      dart: ${{ steps.diff.outputs.dart }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ACTION: ${{ github.event.action }}
          DISPATCH_MACOS: ${{ github.event.inputs.macos }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          code=true
          rust=true
          dart=true
          macos=true
          case "$EVENT" in
            push|pull_request)
              if [ "$EVENT" = push ]; then base="$BEFORE"; else base="$PR_BASE"; fi
              if [ -n "$base" ] && ! echo "$base" | grep -qE '^0+$' && git cat-file -e "$base^{commit}" 2>/dev/null; then
                out=$(git diff --name-only "$base" HEAD | scripts/ci-classify.sh)
                echo "$out"
                code=$(sed -n 's/^code=//p' <<<"$out")
                # Only pull requests narrow by area; main always runs it all.
                if [ "$EVENT" = pull_request ]; then
                  rust=$(sed -n 's/^rust=//p' <<<"$out")
                  dart=$(sed -n 's/^dart=//p' <<<"$out")
                fi
              fi ;;
            schedule)
              # Nightly: only when main moved in the last day.
              [ -n "$(git log --since='24 hours ago' --format=%h -1)" ] || code=false ;;
          esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_MACOS" = false ]; then macos=false; fi
          if [ "$EVENT" = pull_request ]; then
            case ",$PR_LABELS," in *,ci-macos,*) ;; *) macos=false ;; esac
            # Adding some unrelated label must not re-run everything.
            if [ "$ACTION" = labeled ] && [ "$LABEL_NAME" != ci-macos ]; then code=false; fi
          fi
          { echo "code=$code"; echo "rust=$rust"; echo "dart=$dart"; echo "macos=$macos"; } >> "$GITHUB_OUTPUT"
          echo "code=$code rust=$rust dart=$dart macos=$macos"

  # Everything OS-independent, once, on cheap Linux, as four parallel jobs so
  # each reports on every run (one failing suite no longer hides the others)
  # and the slowest, the shipped-profile e2e run, doesn't wait behind the
  # rest. Each job has its own rust-cache key: their target dirs differ.
  lint:
    name: lint (fmt, clippy, analyze, shellcheck)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: needs.changes.outputs.rust == 'true'
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: needs.changes.outputs.dart == 'true'
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: Check the shell scripts
        run: shellcheck install.sh scripts/*.sh apps/desktop/tool/*.sh
      - name: Analyze the desktop app
        if: needs.changes.outputs.dart == 'true'
        working-directory: apps/desktop
        # flutter analyze also covers packages/tern_client, whose own
        # dependencies (package:test) a fresh checkout doesn't have yet.
        run: |
          (cd packages/tern_client && dart pub get)
          flutter analyze
      - name: Clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-tests:
    name: rust tests (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        # Every workspace test binary at once filled the 14 GB runner disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: rust-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust tests (cargo test-all --rust)
        # Workspace tests, then the TUI smoke test against target/debug/tern.
        run: cargo test-all --rust
      - name: Docker sandbox against a real daemon
        if: ${{ !cancelled() }}
        run: cargo test -p tern-sandbox -- --ignored real_docker

  dart-tests:
    name: dart tests (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: dart-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - name: Dart tests (cargo test-all --dart)
        # tern_client and desktop suites, including their live tests against
        # a freshly built target/debug/tern.
        run: cargo test-all --dart

  e2e-dist:
    name: e2e against the shipped binary (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: e2e-dist
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: End-to-end tests against the shipped (dist) binary
        # Test binaries always build with panic=unwind; the shipped profile
        # can differ, so run the binary users actually get.
        run: cargo build --profile dist -p tern && TERN_TEST_BIN="$PWD/target/dist/tern" cargo test -p tern --tests

  # Only what differs on macOS: cfg(macos) code (clippy), the Seatbelt sandbox,
  # path/terminal/service/tray code, the desktop tests that branch on the
  # platform, and the shipped aarch64 binary. Runs after Linux is green.
  check-macos:
    name: macOS-specific tests
    needs: [changes, lint, rust-tests, dart-tests, e2e-dist]
    # Linux jobs the changed paths don't need are skipped, which counts as OK.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.changes.outputs.macos == 'true' && needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: macOS-specific Rust tests (Seatbelt sandbox, paths, tui)
        run: cargo test -p tern-sandbox -p tern-tools -p tern-tui
      - name: Build the shipped binary (also the aarch64 release artifact)
        run: cargo build --profile dist --locked -p tern --target aarch64-apple-darwin
      - name: tern tests and TUI smoke test against the shipped binary
        run: |
          bin="$PWD/target/aarch64-apple-darwin/dist/tern"
          TERN_TEST_BIN="$bin" cargo test -p tern
          python3 scripts/tui-smoke.py "$bin"
      - name: Desktop tests that branch on the platform
        working-directory: apps/desktop
        run: |
          (cd packages/tern_client && dart pub get)
          flutter pub get
          TERN_BIN="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/dist/tern" \
            flutter test test/quit_test.dart test/where_to_run_test.dart test/daemon_test.dart test/store_live_test.dart
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.skip_builds }}
        with:
          name: tern-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/dist/tern

  build-linux:
    name: build ${{ matrix.target }}
    needs: [changes, lint, rust-tests, dart-tests, e2e-dist]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !inputs.skip_builds && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --profile dist --locked -p tern --target ${{ matrix.target }}
      - name: Check binary is static
        run: file target/${{ matrix.target }}/dist/tern | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/tern

  # The unsigned universal desktop app. Not on every push: manual runs and the
  # nightly schedule (release tags are built by release.yml). Reuses the
  # aarch64 binary check-macos already built and compiles only x86_64 here.
  desktop-macos:
    name: desktop app (macOS, universal)
    needs: [changes, check-macos]
    if: ${{ !inputs.skip_builds && needs.changes.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: x86_64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: tern-aarch64-apple-darwin
          path: in/tern-aarch64-apple-darwin
      - run: cargo build --profile dist --locked -p tern --target x86_64-apple-darwin
      - name: Universal tern binary
        run: |
          lipo -create -output in/tern in/tern-aarch64-apple-darwin/tern target/x86_64-apple-darwin/dist/tern
          chmod +x in/tern
          lipo -archs in/tern
      - name: Build and package (ad-hoc signed)
        run: scripts/package-macos-app.sh in/tern out
      - uses: actions/upload-artifact@v4
        with:
          name: tern-desktop-macos-${{ github.sha }}
          path: out/tern-desktop-macos.dmg
          retention-days: 14

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      skip_builds:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      # Every commit, not just the diff: the config is .gitleaks.toml and
      # reviewed false positives are in .gitleaksignore.
      - run: ./gitleaks git . --redact --no-banner --exit-code 1

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Analyze the desktop app
        working-directory: apps/desktop
        run: flutter analyze
      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/*.sh apps/desktop/tool/*.sh
      - name: Rust and Dart tests (cargo test-all)
        # Workspace tests, the TUI smoke test, and the tern_client and
        # desktop suites, including their live tests against target/debug/tern.
        run: cargo test-all
      - name: End-to-end tests against the shipped (dist) binary
        # Test binaries always build with panic=unwind; the shipped profile
        # can differ, so run the binary users actually get.
        run: cargo build --profile dist -p tern && TERN_TEST_BIN="$PWD/target/dist/tern" cargo test -p tern --tests
      - name: Docker sandbox against a real daemon
        if: runner.os == 'Linux'
        run: cargo test -p tern-sandbox -- --ignored real_docker

  build-linux:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.skip_builds }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --profile dist --locked -p tern --target ${{ matrix.target }}
      - name: Check binary is static
        run: file target/${{ matrix.target }}/dist/tern | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/tern

  build-macos:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.skip_builds }}
    runs-on: macos-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked -p tern --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/tern

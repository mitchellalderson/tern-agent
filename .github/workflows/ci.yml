name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand (Actions > ci > Run workflow) to get a desktop DMG from any branch.
  workflow_dispatch:
  # release.yml runs the checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      skip_builds:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo for every test binary filled the 14 GB Linux runner disk
  # ("No space left on device" during cargo test-all). Line tables keep
  # backtraces readable at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      # Every commit, not just the diff: the config is .gitleaks.toml and
      # reviewed false positives are in .gitleaksignore.
      - run: ./gitleaks git . --redact --no-banner --exit-code 1

  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Analyze the desktop app
        working-directory: apps/desktop
        # flutter analyze also covers packages/tern_client, whose own
        # dependencies (package:test) a fresh checkout doesn't have yet.
        run: |
          (cd packages/tern_client && dart pub get)
          flutter analyze
      - name: Check the shell scripts
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/*.sh apps/desktop/tool/*.sh
      - name: Rust and Dart tests (cargo test-all)
        # Workspace tests, the TUI smoke test, and the tern_client and
        # desktop suites, including their live tests against target/debug/tern.
        run: cargo test-all
      - name: End-to-end tests against the shipped (dist) binary
        # Test binaries always build with panic=unwind; the shipped profile
        # can differ, so run the binary users actually get.
        run: cargo build --profile dist -p tern && TERN_TEST_BIN="$PWD/target/dist/tern" cargo test -p tern --tests
      - name: Docker sandbox against a real daemon
        if: runner.os == 'Linux'
        run: cargo test -p tern-sandbox -- --ignored real_docker

  build-linux:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.skip_builds }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --profile dist --locked -p tern --target ${{ matrix.target }}
      - name: Check binary is static
        run: file target/${{ matrix.target }}/dist/tern | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/tern

  build-macos:
    name: build ${{ matrix.target }}
    if: ${{ !inputs.skip_builds }}
    runs-on: macos-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --profile dist --locked -p tern --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/tern

  # An unsigned desktop app from every main push (and manual runs), so there's
  # always a build to try without cutting a release. PRs skip it: macOS
  # minutes are expensive and `flutter analyze` + the tests already ran.
  desktop-macos:
    name: desktop app (macOS, universal)
    if: ${{ !inputs.skip_builds && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tern-*-apple-darwin
          path: in
      - name: Universal tern binary
        run: |
          lipo -create -output in/tern in/tern-aarch64-apple-darwin/tern in/tern-x86_64-apple-darwin/tern
          chmod +x in/tern
          lipo -archs in/tern
      - name: Build and package (ad-hoc signed)
        run: scripts/package-macos-app.sh in/tern out
      - uses: actions/upload-artifact@v4
        with:
          name: tern-desktop-macos-${{ github.sha }}
          path: out/tern-desktop-macos.dmg
          retention-days: 14
